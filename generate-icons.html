<!-- Open this file in a browser, right-click each canvas and "Save image as" icon16.png, icon48.png, icon128.png -->
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function draw(id, size) {
  const c = document.getElementById(id).getContext('2d');
  // Background
  c.fillStyle = '#1d1d1d';
  c.beginPath();
  c.roundRect(0, 0, size, size, size * 0.2);
  c.fill();
  // "X" letter
  c.fillStyle = '#7b61ff';
  c.font = `bold ${size * 0.6}px sans-serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('X', size/2, size/2 + size*0.03);
  // Gear accent
  c.strokeStyle = '#00e5ff';
  c.lineWidth = size * 0.04;
  c.beginPath();
  c.arc(size*0.75, size*0.75, size*0.18, 0, Math.PI*2);
  c.stroke();
}
draw('c16', 16);
draw('c48', 48);
draw('c128', 128);
</script>
